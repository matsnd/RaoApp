- id: q005
  topic: python
  question: "Dlaczego `time.sleep(5)` w async endpoint FastAPI jest katastrofą?"
  options:
    - "Bo sleep jest deprecated w Python 3.14"
    - "Blokuje event loop — cały serwer stoi na 5s (brak preemptive scheduling)"
    - "Bo nie używa await"
    - "Nic złego — sleep jest thread-safe"
  answer: 1
  explanation: "Python async jest single-threaded cooperative. `time.sleep(5)` (sync) blokuje event loop — żaden inny request nie jest obsługiwany. Trzeba `await asyncio.sleep(5)`. FastAPI dla sync `def` wrzuca do threadpoola, ale `async def` + sync sleep = katastrofa."
  ref: "backend/articles/router.py:67"

