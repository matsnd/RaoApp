  explanation: "Default `expire_on_commit=True` — po commit obiekty są 'expired', dostęp do atrybutu triggeruje refetch z DB. W async lazy refetch rzuca `MissingGreenlet` (brak event loop context). `expire_on_commit=False` — obiekty zostają 'live' po commit. Obowiązkowe w async SQLAlchemy."
