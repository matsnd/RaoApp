- id: q002
  topic: python
  question: "Czym różni się Python async od C# async?"
  options:
    - "Niczym — oba używają Task"
    - "Python jest single-threaded cooperative (event loop), brak `.Result`/`.Wait()` sync-block"
    - "Python używa ThreadPool, C# event loop"
    - "Python async jest tylko dla I/O, C# dla wszystkiego"
  answer: 1
  explanation: "Python async = single-threaded event loop (asyncio), cooperative scheduling. Brak `.Result` (nie da się sync-block). C# ma ThreadPool + TaskScheduler. W Pythonie `time.sleep(5)` w async endpoint blokuje cały serwer."
  ref: "backend/articles/router.py:67"

