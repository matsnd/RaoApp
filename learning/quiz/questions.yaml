    - "Float to IEEE 754 — błędy zaokrągleń. Numeric = Decimal, precyzja finansowa"
    - "Numeric jest szybszy"
    - "Float nie wspiera ujemnych wartości"
  answer: 1
  explanation: "`Float` = IEEE 754 double — błędy zaokrągleń (0.1 + 0.2 != 0.3). `Numeric(p, s)` = Decimal, dokładny. Dla pieniędzy ZAWSZE Numeric. W C# też: `decimal` nie `double`. W repo: `replacement_value = Column(Numeric(18, 2))`."
